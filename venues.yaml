# Venue definitions. To add a venue, add one more entry.
#
# source        : dblp | openreview
# month         : usual conference month (used for the completion check)
# all_core      : true skips LLM classification and marks every paper core (RecSys)
# color         : colour slot on the site (1-8, a validated 8-colour order; a 9th venue is shown in grey)
# dblp.tocs     : candidate DBLP TOC (bht) names; {year} is substituted. All that exist are merged and de-duplicated by paper key
# dblp.volumes  : [{from: year, count: n}] number of volumes expected from that year on (KDD has two cycles since 2025)
# tracks        : DBLP TOC section title → normalized track. First matching rule wins (case-insensitive)
#                 normalized tracks: main | short | applied | resource | demo | non_paper
#                 a section matching no rule is counted as main/short by page count and reported in an Issue
# short_max_pages : without section info, papers up to this many pages are short (0 disables)
# complete_rule : date (complete once conference month + 1 has passed) | presence (complete once a listing exists; OpenReview lists only after decisions)
# openreview    : [{from, to, api: v1|v2, invitation|venueid, track}] per year range. track pins every note to that track

counted_tracks: [main, short, applied, resource]   # tracks in the default count (demo is a toggle on the site)
start_year: 2018

venues:
  RecSys:
    name: ACM RecSys
    source: dblp
    month: 9
    all_core: true
    color: 1
    complete_rule: date
    dblp:
      tocs: ["recsys{year}"]
    short_max_pages: 0
    tracks:
      - {match: "reproducib", track: resource}
      - {match: "late[- ]?breaking|lbr", track: short}       # RecSys LBR papers are peer-reviewed short papers
      - {match: "short", track: short}
      - {match: "demo", track: demo}
      - {match: "industr", track: non_paper}                  # the RecSys industry track is talk abstracts (1-2 pages)
      - {match: "keynote|tutorial|workshop|doctoral|panel|poster|challenge|perspective", track: non_paper}
      - {match: "main|research|paper|session|full", track: main}

  SIGIR:
    name: ACM SIGIR
    source: dblp
    month: 7
    color: 2
    complete_rule: date
    dblp:
      tocs: ["sigir{year}"]
    short_max_pages: 5
    tracks:
      - {match: "reproducib|resource", track: resource}
      - {match: "short", track: short}
      - {match: "sirip|industr", track: applied}
      - {match: "demo", track: demo}
      - {match: "keynote|tutorial|workshop|doctoral|panel|salute|award|invited", track: non_paper}
      - {match: "perspective", track: main}
      - {match: "full|research|long|paper|session", track: main}

  KDD:
    name: ACM KDD
    source: dblp
    month: 8
    color: 3
    complete_rule: date
    dblp:
      tocs: ["kdd{year}", "kdd{year}-1", "kdd{year}-2"]
      volumes: [{from: 2025, count: 2}]
    short_max_pages: 0
    tracks:
      - {match: 'applied|\bads\b', track: applied}
      - {match: "dataset|benchmark", track: resource}
      - {match: "demo", track: demo}
      - {match: 'keynote|tutorial|workshop|panel|invited|hands[- ]on|\bcup\b|innovation|test[- ]of[- ]time|award', track: non_paper}
      - {match: "research|paper|session", track: main}

  WWW:
    name: The Web Conference
    source: dblp
    month: 4
    color: 4
    complete_rule: date
    dblp:
      tocs: ["www{year}"]            # 'www{year}c' (companion: workshops, posters) is deliberately excluded
    short_max_pages: 0
    tracks:
      - {match: "industr", track: applied}
      - {match: "resource|dataset", track: resource}
      - {match: "short|poster", track: short}
      - {match: "demo", track: demo}
      - {match: "keynote|tutorial|workshop|panel|phd|doctoral|challenge|web4good|history|invited", track: non_paper}
      - {match: "research|track|paper|session", track: main}

  WSDM:
    name: ACM WSDM
    source: dblp
    month: 2
    color: 5
    complete_rule: date
    dblp:
      tocs: ["wsdm{year}"]
    short_max_pages: 0
    tracks:
      - {match: "demo", track: demo}
      - {match: 'keynote|tutorial|workshop|panel|doctoral|\bcup\b|industry day|invited', track: non_paper}
      - {match: "paper|research|session|full", track: main}

  CIKM:
    name: ACM CIKM
    source: dblp
    month: 11
    color: 6
    complete_rule: date
    dblp:
      tocs: ["cikm{year}"]
    short_max_pages: 5
    tracks:
      - {match: "resource", track: resource}
      - {match: "short", track: short}
      - {match: "applied|industr", track: applied}
      - {match: "demo", track: demo}
      - {match: 'keynote|tutorial|workshop|panel|phd|doctoral|\bcup\b|competition|industry day|invited', track: non_paper}
      - {match: "full|research|long|paper|session", track: main}

  NeurIPS:
    name: NeurIPS
    source: mixed            # 2018~2020 DBLP, 2021~ OpenReview
    month: 12
    color: 7
    complete_rule: presence
    dblp:
      tocs: ["nips{year}", "neurips{year}"]
      years: {to: 2020}
    short_max_pages: 0
    tracks:
      - {match: ".*", track: main}
    openreview:
      - {from: 2021, to: 2022, api: v1, invitation: "NeurIPS.cc/{year}/Conference/-/Blind_Submission", track: main}
      - {from: 2023, api: v2, venueid: "NeurIPS.cc/{year}/Conference", track: main}
      - {from: 2022, to: 2022, api: v1, invitation: "NeurIPS.cc/{year}/Track/Datasets_and_Benchmarks/-/Submission", track: resource}
      - {from: 2023, api: v2, venueid: "NeurIPS.cc/{year}/Track/Datasets_and_Benchmarks", track: resource}
      - {from: 2024, api: v2, venueid: "NeurIPS.cc/{year}/Datasets_and_Benchmarks_Track", track: resource}

  ICLR:
    name: ICLR
    source: openreview
    month: 4
    color: 8
    complete_rule: presence
    dblp:
      tocs: ["iclr{year}"]       # fallback when OpenReview returns nothing (no badges in that case)
    short_max_pages: 0
    tracks:
      - {match: ".*", track: main}
    openreview:
      - {from: 2018, to: 2023, api: v1, invitation: "ICLR.cc/{year}/Conference/-/Blind_Submission", track: main}
      - {from: 2024, api: v2, venueid: "ICLR.cc/{year}/Conference", track: main}
